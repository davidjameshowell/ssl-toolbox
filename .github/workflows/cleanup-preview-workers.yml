name: Cleanup Preview Workers

on:
  workflow_dispatch:
    inputs:
      keep:
        description: >
          Comma-separated branch names whose preview workers should be kept
          (e.g. "main,feature/my-wip"). The production worker is always kept.
          Leave blank to delete ALL preview workers.
        required: false
        default: ""
      dry_run:
        description: "Dry run — list workers that would be deleted without actually deleting them"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete stale preview workers
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Cleanup Preview Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          KEEP_INPUT: ${{ inputs.keep }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_WORKER_NAME; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required setting: ${required}"
              exit 1
            fi
          done

          API_BASE="https://api.cloudflare.com/client/v4"
          PREFIX="${CLOUDFLARE_WORKER_NAME}-preview-"

          # ── Build the set of slugs that should be kept ─────────────────────
          declare -A KEEP_SLUGS
          if [[ -n "${KEEP_INPUT:-}" ]]; then
            IFS=',' read -ra KEEP_BRANCHES <<< "$KEEP_INPUT"
            for branch in "${KEEP_BRANCHES[@]}"; do
              branch="$(echo "$branch" | xargs)"  # trim whitespace
              slug=$(echo "$branch" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-')
              slug=${slug#-}
              slug=${slug%-}
              BASE_NAME="${PREFIX}"
              MAX_SLUG=$(( 54 - ${#BASE_NAME} ))
              if [[ ${#slug} -gt $MAX_SLUG ]]; then
                HASH=$(echo "$slug" | sha256sum | cut -c1-6)
                PREFIX_LEN=$(( MAX_SLUG - 7 ))
                TRIMMED="${slug:0:$PREFIX_LEN}"
                TRIMMED="${TRIMMED%-}"
                slug="${TRIMMED}-${HASH}"
              fi
              KEEP_SLUGS["${PREFIX}${slug}"]=1
            done
          fi

          # Always protect the production worker
          KEEP_SLUGS["${CLOUDFLARE_WORKER_NAME}"]=1

          echo "Workers protected from deletion:"
          for name in "${!KEEP_SLUGS[@]}"; do
            echo "  - $name"
          done
          echo

          # ── Fetch all workers in the account ────────────────────────────────
          PAGE=1
          TO_DELETE=()

          while true; do
            HTTP_CODE=$(curl -sS \
              -o /tmp/cf_workers_page.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "${API_BASE}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts?per_page=100&page=${PAGE}")

            if [[ "$HTTP_CODE" != "200" ]]; then
              echo "Failed to list workers (HTTP $HTTP_CODE):"
              cat /tmp/cf_workers_page.json
              exit 1
            fi

            # Collect names prefixed with our preview prefix
            mapfile -t PAGE_NAMES < <(jq -r \
              --arg prefix "$PREFIX" \
              '.result[] | select(.id | startswith($prefix)) | .id' \
              /tmp/cf_workers_page.json)

            for name in "${PAGE_NAMES[@]}"; do
              if [[ -z "${KEEP_SLUGS[$name]+_}" ]]; then
                TO_DELETE+=("$name")
              else
                echo "Keeping (explicitly protected): $name"
              fi
            done

            TOTAL=$(jq '.result_info.total_count // 0' /tmp/cf_workers_page.json)
            COUNT=$(jq '.result_info.count // 0' /tmp/cf_workers_page.json)
            FETCHED=$(( (PAGE - 1) * 100 + COUNT ))
            if [[ $FETCHED -ge $TOTAL ]]; then
              break
            fi
            PAGE=$(( PAGE + 1 ))
          done

          # ── Report and act ───────────────────────────────────────────────────
          if [[ ${#TO_DELETE[@]} -eq 0 ]]; then
            echo "No preview workers found matching prefix '${PREFIX}' to delete."
            exit 0
          fi

          echo "Preview workers to delete (${#TO_DELETE[@]}):"
          for name in "${TO_DELETE[@]}"; do
            echo "  - $name"
          done
          echo

          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "Dry run enabled — no workers were deleted."
            exit 0
          fi

          FAILED=0
          for name in "${TO_DELETE[@]}"; do
            echo "Deleting: $name"
            if ! wrangler delete --name "$name" --force; then
              echo "  WARNING: failed to delete $name (may already be gone)"
              FAILED=$(( FAILED + 1 ))
            fi
          done

          echo
          echo "Done. Deleted $(( ${#TO_DELETE[@]} - FAILED )) / ${#TO_DELETE[@]} workers."
          if [[ $FAILED -gt 0 ]]; then
            echo "WARNING: $FAILED deletion(s) failed — review output above."
          fi
