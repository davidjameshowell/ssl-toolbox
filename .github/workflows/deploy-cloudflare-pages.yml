name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Debug Cloudflare Authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required setting: ${required}"
              exit 1
            fi
          done

          API_BASE="https://api.cloudflare.com/client/v4"

          echo "Verifying token status..."
          curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/user/tokens/verify" > /tmp/cf_token_verify.json
          jq '{success, errors, result: {id, status, not_before, expires_on}}' /tmp/cf_token_verify.json

          if [[ "$(jq -r '.success // false' /tmp/cf_token_verify.json)" != "true" ]]; then
            echo "Token verification failed."
            exit 1
          fi

          echo
          echo "Listing accounts visible to token..."
          curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/accounts?per_page=100" > /tmp/cf_accounts.json

          if [[ "$(jq -r '.success // false' /tmp/cf_accounts.json)" != "true" ]]; then
            echo "Failed to list accounts visible to token."
            cat /tmp/cf_accounts.json
            exit 1
          fi

          jq -r '.result[] | "- \(.name) [\(.id)]"' /tmp/cf_accounts.json

          if ! jq -e --arg target "$CLOUDFLARE_ACCOUNT_ID" '.result[] | select(.id == $target)' /tmp/cf_accounts.json >/dev/null; then
            echo
            echo "Configured CLOUDFLARE_ACCOUNT_ID is not visible to this token: $CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          echo
          echo "Configured account is visible to token: $CLOUDFLARE_ACCOUNT_ID"

      - name: List Cloudflare Pages Projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required setting: ${required}"
              exit 1
            fi
          done

          API_BASE="https://api.cloudflare.com/client/v4"
          echo "Listing Cloudflare Pages projects for account: $CLOUDFLARE_ACCOUNT_ID"
          HTTP_CODE=$(curl -sS -o /tmp/cf_projects.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")

          if [[ "$HTTP_CODE" != "200" ]] || [[ "$(jq -r '.success // false' /tmp/cf_projects.json)" != "true" ]]; then
            echo "Failed to list Pages projects."
            cat /tmp/cf_projects.json
            exit 1
          fi

          PROJECT_NAMES="$(jq -r '.result[]?.name // empty' /tmp/cf_projects.json)"
          if [[ -z "$PROJECT_NAMES" ]]; then
            echo "No Pages projects visible to this account/token."
          else
            echo "$PROJECT_NAMES"
          fi

      - name: Validate Cloudflare Project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT_NAME; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required setting: ${required}"
              exit 1
            fi
          done

          API_BASE="https://api.cloudflare.com/client/v4"
          HTTP_CODE=$(curl -sS -o /tmp/cf_project.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT_NAME")

          if [[ "$HTTP_CODE" != "200" ]] || [[ "$(jq -r '.success // false' /tmp/cf_project.json)" != "true" ]]; then
            echo "Cloudflare project preflight failed."
            echo "Account ID: $CLOUDFLARE_ACCOUNT_ID"
            echo "Requested project: $CLOUDFLARE_PAGES_PROJECT_NAME"
            echo "API response:"
            cat /tmp/cf_project.json

            echo
            echo "Projects visible in this account:"
            curl -sS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              | jq -r '.result[]?.name // empty' || true
            exit 1
          fi

          echo "Preflight ok: project found in configured account."

      - name: Deploy Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_PAGES_PROJECT_NAME:-}" ]]; then
            echo "Missing repository variable: CLOUDFLARE_PAGES_PROJECT_NAME"
            exit 1
          fi
          wrangler pages deploy . \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "${GITHUB_REF_NAME}" \
            --commit-dirty=true

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Debug Cloudflare Authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required setting: ${required}"
              exit 1
            fi
          done

          API_BASE="https://api.cloudflare.com/client/v4"

          echo "Verifying token status..."
          curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/user/tokens/verify" > /tmp/cf_token_verify.json
          jq '{success, errors, result: {id, status, not_before, expires_on}}' /tmp/cf_token_verify.json

          if [[ "$(jq -r '.success // false' /tmp/cf_token_verify.json)" != "true" ]]; then
            echo "Token verification failed."
            exit 1
          fi

          echo
          echo "Listing accounts visible to token..."
          curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/accounts?per_page=100" > /tmp/cf_accounts.json

          if [[ "$(jq -r '.success // false' /tmp/cf_accounts.json)" != "true" ]]; then
            echo "Failed to list accounts visible to token."
            cat /tmp/cf_accounts.json
            exit 1
          fi

          jq -r '.result[] | "- \(.name) [\(.id)]"' /tmp/cf_accounts.json

          if ! jq -e --arg target "$CLOUDFLARE_ACCOUNT_ID" '.result[] | select(.id == $target)' /tmp/cf_accounts.json >/dev/null; then
            echo
            echo "Configured CLOUDFLARE_ACCOUNT_ID is not visible to this token: $CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          echo
          echo "Configured account is visible to token: $CLOUDFLARE_ACCOUNT_ID"

      - name: List Cloudflare Pages Projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required setting: ${required}"
              exit 1
            fi
          done

          API_BASE="https://api.cloudflare.com/client/v4"
          echo "Listing Cloudflare Pages projects for account: $CLOUDFLARE_ACCOUNT_ID"
          HTTP_CODE=$(curl -sS -o /tmp/cf_projects.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")

          if [[ "$HTTP_CODE" != "200" ]] || [[ "$(jq -r '.success // false' /tmp/cf_projects.json)" != "true" ]]; then
            echo "Failed to list Pages projects."
            cat /tmp/cf_projects.json
            exit 1
          fi

          PROJECT_NAMES="$(jq -r '.result[]?.name // empty' /tmp/cf_projects.json)"
          if [[ -z "$PROJECT_NAMES" ]]; then
            echo "No Pages projects visible to this account/token."
          else
            echo "$PROJECT_NAMES"
          fi

      - name: Validate Cloudflare Project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT_NAME; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required setting: ${required}"
              exit 1
            fi
          done

          API_BASE="https://api.cloudflare.com/client/v4"
          HTTP_CODE=$(curl -sS -o /tmp/cf_project.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT_NAME")

          if [[ "$HTTP_CODE" != "200" ]] || [[ "$(jq -r '.success // false' /tmp/cf_project.json)" != "true" ]]; then
            echo "Cloudflare project preflight failed."
            echo "Account ID: $CLOUDFLARE_ACCOUNT_ID"
            echo "Requested project: $CLOUDFLARE_PAGES_PROJECT_NAME"
            echo "API response:"
            cat /tmp/cf_project.json

            echo
            echo "Projects visible in this account:"
            curl -sS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
