name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild OpenSSL Artifacts
        run: bash scripts/rebuild_openssl_if_changed.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate Cloudflare Project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT_NAME; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required setting: ${required}"
              exit 1
            fi
          done

          API_BASE="https://api.cloudflare.com/client/v4"
          HTTP_CODE=$(curl -sS -o /tmp/cf_project.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT_NAME")

          if [[ "$HTTP_CODE" != "200" ]] || [[ "$(jq -r '.success // false' /tmp/cf_project.json)" != "true" ]]; then
            echo "Cloudflare project preflight failed."
            echo "Account ID: $CLOUDFLARE_ACCOUNT_ID"
            echo "Requested project: $CLOUDFLARE_PAGES_PROJECT_NAME"
            echo "API response:"
            cat /tmp/cf_project.json

            echo
            echo "Projects visible in this account:"
            curl -sS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              | jq -r '.result[]?.name // empty' || true
            exit 1
          fi

          echo "Preflight ok: project found in configured account."

      - name: Deploy Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_PAGES_PROJECT_NAME:-}" ]]; then
            echo "Missing repository variable: CLOUDFLARE_PAGES_PROJECT_NAME"
            exit 1
          fi
          wrangler pages deploy . \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "${GITHUB_REF_NAME}" \
            --commit-dirty=true

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild OpenSSL Artifacts
        run: bash scripts/rebuild_openssl_if_changed.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate Cloudflare Project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT_NAME; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required setting: ${required}"
              exit 1
            fi
          done

          API_BASE="https://api.cloudflare.com/client/v4"
          HTTP_CODE=$(curl -sS -o /tmp/cf_project.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT_NAME")

          if [[ "$HTTP_CODE" != "200" ]] || [[ "$(jq -r '.success // false' /tmp/cf_project.json)" != "true" ]]; then
            echo "Cloudflare project preflight failed."
            echo "Account ID: $CLOUDFLARE_ACCOUNT_ID"
            echo "Requested project: $CLOUDFLARE_PAGES_PROJECT_NAME"
            echo "API response:"
            cat /tmp/cf_project.json

            echo
            echo "Projects visible in this account:"
            curl -sS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              | jq -r '.result[]?.name // empty' || true
            exit 1
          fi

          echo "Preflight ok: project found in configured account."

      - name: Deploy Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          CLOUDFLARE_PAGES_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PAGES_PRODUCTION_BRANCH }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_PAGES_PROJECT_NAME:-}" ]]; then
            echo "Missing repository variable: CLOUDFLARE_PAGES_PROJECT_NAME"
            exit 1
          fi
          PROD_BRANCH="${CLOUDFLARE_PAGES_PRODUCTION_BRANCH:-main}"
          wrangler pages deploy . \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "$PROD_BRANCH" \
            --commit-dirty=true
