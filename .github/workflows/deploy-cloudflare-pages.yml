name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  delete:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_WORKER_COMPATIBILITY_DATE: "2026-04-06"

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Debug Cloudflare Authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required setting: ${required}"
              exit 1
            fi
          done

          API_BASE="https://api.cloudflare.com/client/v4"

          echo "Verifying token status..."
          HTTP_CODE=$(curl -sS -o /tmp/cf_token_verify.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")

          if [[ "$HTTP_CODE" != "200" ]] || [[ "$(jq -r '.success // false' /tmp/cf_token_verify.json)" != "true" ]]; then
            echo "Token verification failed."
            cat /tmp/cf_token_verify.json
            exit 1
          fi

          jq '{success, errors, result: {id, status, not_before, expires_on}}' /tmp/cf_token_verify.json

          echo
          echo "Listing workers services visible in configured account..."
          HTTP_CODE=$(curl -sS -o /tmp/cf_workers_services.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services")

          if [[ "$HTTP_CODE" != "200" ]] || [[ "$(jq -r '.success // false' /tmp/cf_workers_services.json)" != "true" ]]; then
            echo "Failed to list workers services."
            cat /tmp/cf_workers_services.json
            exit 1
          fi

          jq -r '.result[] | "- \(.name // .id // .script // "<unknown>")"' /tmp/cf_workers_services.json

      - name: Deploy Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_WORKER_COMPATIBILITY_DATE: ${{ vars.CLOUDFLARE_WORKER_COMPATIBILITY_DATE }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_WORKER_NAME; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required setting: ${required}"
              exit 1
            fi
          done

          REF_SLUG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-')
          REF_SLUG=${REF_SLUG#-}
          REF_SLUG=${REF_SLUG%-}
          BASE_NAME="${CLOUDFLARE_WORKER_NAME}-preview-"
          MAX_SLUG=$(( 63 - ${#BASE_NAME} ))
          if [[ ${#REF_SLUG} -gt $MAX_SLUG ]]; then
            HASH=$(echo "$REF_SLUG" | sha256sum | cut -c1-6)
            PREFIX_LEN=$(( MAX_SLUG - 7 ))
            PREFIX="${REF_SLUG:0:$PREFIX_LEN}"
            PREFIX="${PREFIX%-}"
            REF_SLUG="${PREFIX}-${HASH}"
          fi
          PREVIEW_NAME="${BASE_NAME}${REF_SLUG}"
          COMPATIBILITY_DATE="${CLOUDFLARE_WORKER_COMPATIBILITY_DATE:-$DEFAULT_WORKER_COMPATIBILITY_DATE}"

          echo "Deploying preview worker: $PREVIEW_NAME"
          wrangler deploy \
            --name "$PREVIEW_NAME" \
            --compatibility-date "$COMPATIBILITY_DATE" \
            --assets .

  deploy-production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Debug Cloudflare Authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required setting: ${required}"
              exit 1
            fi
          done

          API_BASE="https://api.cloudflare.com/client/v4"

          echo "Verifying token status..."
          HTTP_CODE=$(curl -sS -o /tmp/cf_token_verify.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")

          if [[ "$HTTP_CODE" != "200" ]] || [[ "$(jq -r '.success // false' /tmp/cf_token_verify.json)" != "true" ]]; then
            echo "Token verification failed."
            cat /tmp/cf_token_verify.json
            exit 1
          fi

          jq '{success, errors, result: {id, status, not_before, expires_on}}' /tmp/cf_token_verify.json

          echo
          echo "Listing workers services visible in configured account..."
          HTTP_CODE=$(curl -sS -o /tmp/cf_workers_services.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services")

          if [[ "$HTTP_CODE" != "200" ]] || [[ "$(jq -r '.success // false' /tmp/cf_workers_services.json)" != "true" ]]; then
            echo "Failed to list workers services."
            cat /tmp/cf_workers_services.json
            exit 1
          fi

          jq -r '.result[] | "- \(.name // .id // .script // "<unknown>")"' /tmp/cf_workers_services.json

      - name: Deploy Production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_WORKER_COMPATIBILITY_DATE: ${{ vars.CLOUDFLARE_WORKER_COMPATIBILITY_DATE }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_WORKER_NAME; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required setting: ${required}"
              exit 1
            fi
          done

          COMPATIBILITY_DATE="${CLOUDFLARE_WORKER_COMPATIBILITY_DATE:-$DEFAULT_WORKER_COMPATIBILITY_DATE}"
          echo "Deploying production worker: $CLOUDFLARE_WORKER_NAME"
          wrangler deploy \
            --name "$CLOUDFLARE_WORKER_NAME" \
            --compatibility-date "$COMPATIBILITY_DATE" \
            --assets .

  cleanup-preview:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Delete Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          DELETED_REF: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_WORKER_NAME; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required setting: ${required}"
              exit 1
            fi
          done

          REF_SLUG=$(echo "$DELETED_REF" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-')
          REF_SLUG=${REF_SLUG#-}
          REF_SLUG=${REF_SLUG%-}
          BASE_NAME="${CLOUDFLARE_WORKER_NAME}-preview-"
          MAX_SLUG=$(( 63 - ${#BASE_NAME} ))
          if [[ ${#REF_SLUG} -gt $MAX_SLUG ]]; then
            HASH=$(echo "$REF_SLUG" | sha256sum | cut -c1-6)
            PREFIX_LEN=$(( MAX_SLUG - 7 ))
            PREFIX="${REF_SLUG:0:$PREFIX_LEN}"
            PREFIX="${PREFIX%-}"
            REF_SLUG="${PREFIX}-${HASH}"
          fi
          PREVIEW_NAME="${BASE_NAME}${REF_SLUG}"

          echo "Deleting preview worker: $PREVIEW_NAME"
          wrangler delete --name "$PREVIEW_NAME" --force || true
