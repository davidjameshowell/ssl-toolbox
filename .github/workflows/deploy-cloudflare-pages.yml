            exit 1
          fi

          echo "Preflight ok: project found in configured account."

      - name: Deploy Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          CLOUDFLARE_PAGES_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PAGES_PRODUCTION_BRANCH }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_PAGES_PROJECT_NAME:-}" ]]; then
            echo "Missing repository variable: CLOUDFLARE_PAGES_PROJECT_NAME"
            exit 1
          fi
          PROD_BRANCH="${CLOUDFLARE_PAGES_PRODUCTION_BRANCH:-main}"
