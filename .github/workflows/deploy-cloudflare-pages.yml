name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_PAGES_PROJECT_NAME:-}" ]]; then
            echo "Missing repository variable: CLOUDFLARE_PAGES_PROJECT_NAME"
            exit 1
          fi
          wrangler pages deploy . \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "${GITHUB_REF_NAME}"

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          CLOUDFLARE_PAGES_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PAGES_PRODUCTION_BRANCH }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_PAGES_PROJECT_NAME:-}" ]]; then
            echo "Missing repository variable: CLOUDFLARE_PAGES_PROJECT_NAME"
            exit 1
          fi
          PROD_BRANCH="${CLOUDFLARE_PAGES_PRODUCTION_BRANCH:-main}"
          wrangler pages deploy . \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "$PROD_BRANCH"
